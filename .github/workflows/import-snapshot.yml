name: Import pinned snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: import-pinned-snapshot
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'hyeonbungi/artex-ko' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Copy Git objects without executing source code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          SOURCE_COMMIT: c653bcdc38032b6f3129e571ae6073b6fe1c8c77
          SOURCE_TREE: 0d096c05f601fd07970c2733721385aee17f26b6
          HELPER: .github/workflows/import-snapshot.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = hyeonbungi/artex-ko
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = 'hyeonbungi/artex-ko/.github/workflows/import-snapshot.yml@refs/heads/main'
          test "$(gh api repos/hyeonbungi/artex-ko --jq '.fork')" = false
          test "$(gh api repos/hyeonbungi/artex-ko --jq '.visibility')" = public
          test "$(gh api repos/hyeonbungi/artex-ko --jq '.default_branch')" = main
          for file in ci.yml detections.yml docs.yml external-links.yml release.yml web.yml; do
            test "$(gh api "repos/hyeonbungi/artex-ko/actions/workflows/$file" --jq '.state')" = disabled_manually
          done
          repo_dir="$(mktemp -d "$RUNNER_TEMP/snapshot-import.XXXXXX")"
          git init --bare --template= "$repo_dir"
          cd "$repo_dir"
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add destination https://github.com/hyeonbungi/artex-ko.git
          git fetch --no-tags destination refs/heads/main
          base="$(git rev-parse FETCH_HEAD)"
          test "$base" = "$GITHUB_SHA"
          test "$(git ls-tree -r --name-only "$base" | wc -l)" -eq 7
          test "$(git ls-tree -r --name-only "$base" -- .github/workflows | wc -l)" -eq 7
          git fetch --no-tags --depth=1 https://github.com/jiwoochris/artex-ko.git "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          test "$(git ls-tree -r --name-only "$SOURCE_TREE" | wc -l)" -eq 774
          test -z "$(git ls-tree "$SOURCE_TREE" -- "$HELPER")"
          if git merge-base --is-ancestor "$SOURCE_COMMIT" "$base"; then
            echo 'Refusing a destination with source history.' >&2
            exit 1
          fi
          git read-tree "$SOURCE_TREE"
          git ls-tree "$base" -- "$HELPER" | git update-index --index-info
          imported_tree="$(git write-tree)"
          git diff --quiet "$base" "$imported_tree" -- .github/workflows
          test "$(git ls-tree -r --name-only "$imported_tree" | wc -l)" -eq 775
          printf '0 %040d\t%s\n' 0 "$HELPER" | git update-index --index-info
          test "$(git write-tree)" = "$SOURCE_TREE"
          new_commit="$(git commit-tree "$imported_tree" -p "$base" -m 'Import pinned source snapshot without upstream history [skip ci]' -m 'Source: https://github.com/jiwoochris/artex-ko/tree/c653bcdc38032b6f3129e571ae6073b6fe1c8c77')"
          test "$(git rev-parse "$new_commit^1")" = "$base"
          test "$(git rev-list --count "$new_commit" "^$base")" -eq 1
          gh auth setup-git --hostname github.com
          git push destination "$new_commit:refs/heads/main"
          test "$(git ls-remote destination refs/heads/main | cut -f1)" = "$new_commit"
          printf 'Imported commit: %s\nSource tree after browser cleanup: %s\n' "$new_commit" "$SOURCE_TREE"
          printf 'Imported commit: %s\n\nDelete only %s in the browser after disabling repository Actions.\n\nExpected final tree: %s\n' "$new_commit" "$HELPER" "$SOURCE_TREE" >> "$GITHUB_STEP_SUMMARY"
